<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Calorie Tracker{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
<link rel="manifest" href="{{ url_for('manifest') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.svg') }}">
<meta name="theme-color" content="#f6f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#20211e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Calories">
<script>
  document.documentElement.setAttribute(
    "data-theme", localStorage.getItem("calorie-theme") || "light"
  );
  window.BASE = {{ request.script_root | tojson }};
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}">
    <img src="{{ url_for('static', filename='logo.svg') }}" alt="">
    <span class="hud">Calorie Tracker</span>
  </a>
  <nav class="nav">
    <a href="{{ url_for('index') }}" class="{{ 'active' if page == 'today' }}">Today</a>
    <a href="{{ url_for('history_page') }}" class="{{ 'active' if page == 'history' }}">History</a>
    <a href="{{ url_for('profile_page') }}" class="{{ 'active' if page == 'profile' }}">Profile</a>
  </nav>
  <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
    <svg class="ic" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.5 5.5 0 0 1-7.54-7.54c-.44-.06-.9-.1-1.36-.1z"/></svg>
  </button>
</header>

<main class="wrap">
{% block content %}{% endblock %}
</main>

<div class="toast" id="toast"></div>

<script>
  // ---- shared helpers ----
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const api = (path, opts) => fetch(window.BASE + path, opts).then(async (r) => {
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.error || ("HTTP " + r.status));
    return body;
  });
  const fmt = (n) => (n == null ? "–" : Math.round(n).toLocaleString());
  let _toastT;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(_toastT);
    _toastT = setTimeout(() => t.classList.remove("show"), 2200);
  }

  // ---- theme ----
  $("#themeBtn").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("calorie-theme", next);
  });

  // ---- service worker ----
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register(window.BASE + "/sw.js").catch(() => {});
    });
  }
</script>
{% block script %}{% endblock %}
</body>
</html>
